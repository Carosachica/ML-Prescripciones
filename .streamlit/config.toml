# Tema de la aplicación (se fuerza el tema claro para que los colores institucionales se vean igual en cualquier equipo)
[theme]
base = "light"
primaryColor = "#0B2545"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F8FB"
textColor = "#1B2A41"
font = "sans serif"

[browser]
gatherUsageStats = false
